name: Bug
description: Something is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security problem?** Do not use this form — see SECURITY.md and email us privately."
  - type: textarea
    id: what-happens
    attributes: { label: What happens }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should happen }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations: { required: true }
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: ["English", "नेपाली", "Both"]
  - type: input
    id: environment
    attributes:
      label: Browser and device
  - type: markdown
    attributes:
      value: "Please do not include real personal data, credentials, or production records."
