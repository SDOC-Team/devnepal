openapi: 3.1.1
info:
  title: Gov Portal API
  version: 1.0.0
  description: |
    The versioned API for the Gov Portal project, member directory, and
    moderation workflow. API representations are stable at the contract
    boundary; database and framework models are never exposed.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
    description: Same-origin API served by the same Next.js application as the web UI.
security: []
tags:
  - name: Project
    description: Project metadata and GitHub issue discovery.
  - name: Members
    description: Public member directory and authenticated member profiles.
  - name: Administration
    description: Member moderation operations for configured administrators.
paths:
  /project:
    get:
      tags: [Project]
      operationId: getProject
      summary: Get the active project overview
      responses:
        '200':
          description: Active project overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /project/issues:
    get:
      tags: [Project]
      operationId: listProjectIssues
      summary: List open project issues
      parameters:
        - $ref: '#/components/parameters/IssueLabel'
        - $ref: '#/components/parameters/IssueSearch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of open issues, ordered by most recently updated first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /project/issues/labels:
    get:
      tags: [Project]
      operationId: listIssueLabels
      summary: List issue labels and their open-issue counts
      responses:
        '200':
          description: Label facets for the active project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueLabelFacetListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /project/issues/{number}:
    get:
      tags: [Project]
      operationId: getProjectIssue
      summary: Get one project issue
      parameters:
        - $ref: '#/components/parameters/IssueNumber'
      responses:
        '200':
          description: The requested issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List approved directory members
      responses:
        '200':
          description: Approved members only, ordered by directory priority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /members/{username}:
    get:
      tags: [Members]
      operationId: getMemberByUsername
      summary: Get a member by GitHub username
      description: |
        Approved members are public. A signed-in member may also read their own
        non-public profile; other non-public profiles return 404.
      parameters:
        - $ref: '#/components/parameters/GithubUsername'
      responses:
        '200':
          description: The requested member profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /members/id/{githubId}:
    get:
      tags: [Members]
      operationId: getMemberByGithubId
      summary: Get a member by their numeric GitHub identifier
      parameters:
        - $ref: '#/components/parameters/GithubId'
      responses:
        '200':
          description: The requested member profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile:
    get:
      tags: [Members]
      operationId: getCurrentProfile
      summary: Get the signed-in member's profile
      security:
        - AuthJsSession: []
      responses:
        '200':
          description: The session member and their current administrative capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Members]
      operationId: updateCurrentProfile
      summary: Update the signed-in member's profile
      description: Only editable profile fields are accepted. Identity and moderation fields are rejected.
      security:
        - AuthJsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated self profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/members:
    get:
      tags: [Administration]
      operationId: listAdminMembers
      summary: List members for moderation
      security:
        - AuthJsSession: []
      parameters:
        - $ref: '#/components/parameters/MemberStatus'
      responses:
        '200':
          description: Moderation queue, optionally filtered by status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/members/{id}:
    patch:
      tags: [Administration]
      operationId: updateAdminMember
      summary: Update a member's moderation status or priority
      security:
        - AuthJsSession: []
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMemberUpdate'
      responses:
        '200':
          description: Updated moderation record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMemberResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    AuthJsSession:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Browser session issued by the Auth.js GitHub sign-in flow. External clients must not depend on this browser-cookie scheme.
  parameters:
    GithubUsername:
      name: username
      in: path
      required: true
      description: GitHub login name.
      schema:
        type: string
        minLength: 1
        maxLength: 39
    GithubId:
      name: githubId
      in: path
      required: true
      description: Numeric GitHub account identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    IssueNumber:
      name: number
      in: path
      required: true
      description: Positive GitHub issue number.
      schema:
        type: integer
        minimum: 1
    MemberId:
      name: id
      in: path
      required: true
      description: Internal member identifier, available to administrators only.
      schema:
        type: string
        format: uuid
    IssueLabel:
      name: label
      in: query
      required: false
      description: Exact GitHub label name.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    IssueSearch:
      name: q
      in: query
      required: false
      description: Case-insensitive search of issue title and body.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    MemberStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MemberStatus'
  responses:
    ValidationError:
      description: The request parameters or JSON body are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated actor is not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist or is not visible to the actor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests from this client.
      headers:
        Retry-After:
          required: true
          description: Seconds until the client may retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    MemberStatus:
      type: string
      enum: [pending, approved, rejected, hidden]
    Skill:
      type: string
      enum: [engineering, ui-ux, qa, security, data, documentation, localization, research, community]
    IssueLabel:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        name:
          type: string
        color:
          type: string
          pattern: '^[0-9a-fA-F]{6}$'
    IssueLabelFacet:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          minimum: 0
    Issue:
      type: object
      additionalProperties: false
      required: [number, title, body, state, labels, authorLogin, authorAvatarUrl, htmlUrl, commentsCount, createdAt, updatedAt]
      properties:
        number:
          type: integer
          minimum: 1
        title:
          type: string
        body:
          type: [string, 'null']
        state:
          type: string
          enum: [open, closed]
        labels:
          type: array
          items:
            $ref: '#/components/schemas/IssueLabel'
        authorLogin:
          type: string
        authorAvatarUrl:
          type: [string, 'null']
          format: uri
        htmlUrl:
          type: string
          format: uri
        commentsCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueList:
      type: object
      additionalProperties: false
      required: [issues, total, page, perPage]
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 50
    Project:
      type: object
      additionalProperties: false
      required: [githubRepoId, fullName, title, description, htmlUrl, license, openIssueCount, memberCount, lastSyncedAt]
      properties:
        githubRepoId:
          type: integer
          format: int64
          minimum: 1
        fullName:
          type: string
        title:
          type: string
        description:
          type: [string, 'null']
        htmlUrl:
          type: string
          format: uri
        license:
          type: [string, 'null']
        openIssueCount:
          type: integer
          minimum: 0
        memberCount:
          type: integer
          minimum: 0
        lastSyncedAt:
          type: [string, 'null']
          format: date-time
    Member:
      type: object
      required: [githubId, githubUsername, displayName, headline, affiliation, location, bio, links, skills, avatarUrl]
      properties:
        githubId:
          type: integer
          format: int64
          minimum: 1
        githubUsername:
          type: string
          maxLength: 39
        displayName:
          type: string
          maxLength: 80
        headline:
          type: [string, 'null']
          maxLength: 120
        affiliation:
          type: [string, 'null']
          maxLength: 120
        location:
          type: [string, 'null']
          maxLength: 80
        bio:
          type: [string, 'null']
          maxLength: 400
        links:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uri
            pattern: '^https://'
        skills:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Skill'
        avatarUrl:
          type: [string, 'null']
          description: Relative URL to the immutable avatar asset.
    Profile:
      allOf:
        - $ref: '#/components/schemas/Member'
        - type: object
          required: [id, status, approvedAt, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/MemberStatus'
            approvedAt:
              type: [string, 'null']
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AdminMember:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          required: [priority, approvedBy]
          properties:
            priority:
              type: integer
            approvedBy:
              type: [string, 'null']
              format: uuid
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        headline:
          type: [string, 'null']
          maxLength: 120
        affiliation:
          type: [string, 'null']
          maxLength: 120
        location:
          type: [string, 'null']
          maxLength: 80
        bio:
          type: [string, 'null']
          maxLength: 400
        links:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uri
            pattern: '^https://'
        skills:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Skill'
    AdminMemberUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/MemberStatus'
        priority:
          type: integer
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [validation_error, unauthorized, forbidden, not_found, rate_limited, internal_error]
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project:
          $ref: '#/components/schemas/Project'
    IssueResponse:
      type: object
      additionalProperties: false
      required: [issue]
      properties:
        issue:
          $ref: '#/components/schemas/Issue'
    IssueLabelFacetListResponse:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels:
          type: array
          items:
            $ref: '#/components/schemas/IssueLabelFacet'
    MemberListResponse:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    MemberResponse:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member:
          $ref: '#/components/schemas/Member'
    ProfileResponse:
      type: object
      additionalProperties: false
      required: [member, isAdmin]
      properties:
        member:
          $ref: '#/components/schemas/Profile'
        isAdmin:
          type: boolean
    ProfileUpdateResponse:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member:
          $ref: '#/components/schemas/Profile'
    AdminMemberListResponse:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/AdminMember'
    AdminMemberResponse:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member:
          $ref: '#/components/schemas/AdminMember'
